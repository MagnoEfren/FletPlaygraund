[project]
name = "flet-widgets-playground"
version = "2.0.0"
description = "Explora los widgets de Flet 1.0 en vivo: parámetros, vista previa y código."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.0",
    "certifi",
]

[tool.flet]
org = "dev.magnoefren"
product = "Flet Widgets Playground"
company = "MagnoEfren"
copyright = "Copyright (C) 2026 MagnoEfren"

[tool.flet.app]
path = "."

[dependency-groups]
dev = ["flet[all]==1.0.0"]
